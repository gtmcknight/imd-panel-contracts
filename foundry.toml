[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
# no metadata hash in the bytecode, so a launch can compare deployed bytes with the build
bytecode_hash = "none"
# each call a test makes is its own transaction, every account and slot cold, as an eth_call sees them
isolate = true
# the tests read each contract's storage layout from its artifact
extra_output = ["storageLayout"]
remappings = ["forge-std/=lib/forge-std/src/"]
# the shape tests read the compiled artifacts, and nothing else
fs_permissions = [{ access = "read", path = "./out" }]

[rpc_endpoints]
mainnet = "${MAINNET_RPC}"
